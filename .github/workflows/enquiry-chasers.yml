name: Chase unanswered enquiries

# Every morning, remind cleaners who have an enquiry they have not replied to.
#
# The gap this fills: the new-message notifier only fires when somebody SENDS
# something. A first enquiry is one message and then waiting, so if that single
# email is missed the thread goes silent forever with a real customer on the
# other end. Nothing looked at "nobody has replied" as a state until this.
#
# Safe to run daily because of what the endpoint guarantees, not because of
# anything here: each thread is chased on days 1, 3 and 7 after the customer's
# last message and then never again (a counter on the conversation enforces it),
# and a thread the cleaner has answered, declined or booked drops out entirely.
# So a daily run only ever reaches someone whose reminder fell due that day.
#
# 19:00 UTC = 7am NZST / 8am NZDT. A cleaner reads this at the start of the day,
# when replying is a thing they can actually do, rather than last thing at night.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      send:
        description: Actually send (unticked = dry run, sends nothing)
        required: false
        default: false
        type: boolean

jobs:
  chase:
    runs-on: ubuntu-latest
    steps:
      - name: Remind cleaners sitting on an unanswered enquiry
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A scheduled run carries no inputs, so `inputs.send` is empty and
          # would dry-run forever. The schedule has to say so explicitly.
          SEND: ${{ github.event_name == 'schedule' && '1' || (inputs.send && '1' || '0') }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          # A sleeping service answers only once it has booted, so allow the
          # full cold start. --fail-with-body prints the API's error message.
          curl -sS --fail-with-body --max-time 120 \
            -X POST "https://matchmaid.onrender.com/api/tasks/enquiry-chasers?send=$SEND" \
            -H "x-cron-secret: $CRON_SECRET"
