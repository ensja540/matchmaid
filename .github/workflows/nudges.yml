name: Nudges and updates

# Weekly on a schedule, plus manual whenever you want.
#
# The scheduled run sends the profile nudges for real. That is safe because of
# what the endpoint itself guarantees, not because of anything here: each person
# can only ever receive each nudge once (a unique index enforces it), nobody is
# nudged inside 48 hours of signing up, and opting out excludes you. So a weekly
# run only ever reaches people who newly stalled during that week - it cannot
# re-mail the same person, however many times it fires.
#
# The pre-launch broadcast is deliberately NOT scheduled. It is a one-off, and
# the schedule defaults to the nudges task so it can never pick it up by
# accident - run that one by hand.
#
# 20:00 UTC Sunday = Monday 8am NZST / 9am NZDT. A weekday morning, so anyone
# who acts on it lands on the site during the day.
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      task:
        description: Which mail to run
        required: true
        default: nudges
        type: choice
        options:
          - nudges            # finish-your-profile, per stalled funnel stage
          - prelaunch-update  # the "where we're up to" broadcast
      send:
        description: Actually send (unticked = dry run, sends nothing)
        required: false
        default: false
        type: boolean
      kind:
        description: "nudges only: limit to one segment (cleaner_no_rate, cleaner_no_id, customer_no_suburb)"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Send (or dry-run) the selected mail
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A scheduled run carries no inputs at all - every `inputs.*` is empty.
          # Left as-is that would post to /api/tasks/ (a 404) and, because an
          # empty SEND is not "true", would dry-run forever and never actually
          # send. Both have to be defaulted explicitly for the schedule.
          TASK: ${{ inputs.task || 'nudges' }}
          SEND: ${{ github.event_name == 'schedule' && 'true' || inputs.send }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          QS=""
          [ "$SEND" = "true" ] && QS="?send=1"
          if [ -n "$KIND" ] && [ "$TASK" = "nudges" ]; then
            if [ -z "$QS" ]; then QS="?kind=$KIND"; else QS="$QS&kind=$KIND"; fi
          fi
          if [ "$SEND" = "true" ]; then
            echo "::warning::SENDING REAL EMAIL for $TASK"
          else
            echo "Dry run - nothing will be sent."
          fi
          # A sleeping service answers only once it has booted, so allow the
          # full cold start. --fail-with-body surfaces the API's own message,
          # which is how the "email is not configured" refusal shows up here.
          curl -sS --fail-with-body --max-time 120 \
            -X POST "https://matchmaid.onrender.com/api/tasks/$TASK$QS" \
            -H "x-cron-secret: $CRON_SECRET"
